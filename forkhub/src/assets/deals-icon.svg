<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Wallet/Money bag -->
  <rect x="12" y="16" width="40" height="32" rx="3" fill="#B20024"/>
  <!-- Wallet flap -->
  <path d="M 12 16 Q 32 24 52 16" fill="#92001C"/>
  <!-- Money symbol -->
  <circle cx="32" cy="36" r="12" fill="#BDAA6A"/>
  <!-- Dollar sign -->
  <text x="32" y="42" font-size="20" font-weight="bold" text-anchor="middle" fill="#B20024">$</text>
  <!-- Highlight -->
  <ellipse cx="32" cy="20" rx="15" ry="4" fill="#F6F0E2" opacity="0.2"/>
</svg>