<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Wallet/Money bag -->
  <rect x="12" y="16" width="40" height="32" rx="3" fill="#98008f"/>
  <!-- Wallet flap -->
  <path d="M 12 16 Q 32 24 52 16" fill="#7a0573"/>
  <!-- Money symbol -->
  <circle cx="32" cy="36" r="12" fill="#ffc97b"/>
  <!-- Dollar sign -->
  <text x="32" y="42" font-size="20" font-weight="bold" text-anchor="middle" fill="#98008f">$</text>
  <!-- Highlight -->
  <ellipse cx="32" cy="20" rx="15" ry="4" fill="#fff" opacity="0.2"/>
</svg>